name: Verify reviewer

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'
      - name: Build Release solution
        shell: bash
        run: dotnet build Ten28-PrReviewer.slnx --configuration Release --artifacts-path "$RUNNER_TEMP/ten28-verification"
      - name: Run complete offline suite
        shell: bash
        run: dotnet test Ten28-PrReviewer.slnx --configuration Release --artifacts-path "$RUNNER_TEMP/ten28-verification" --no-build --no-restore
      - name: Run offline demo
        shell: bash
        run: dotnet "$RUNNER_TEMP/ten28-verification/bin/Ten28-PrReviewer/release/Ten28-PrReviewer.dll" --demo
